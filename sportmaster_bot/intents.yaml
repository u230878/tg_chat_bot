# Интенты для чат-бота ООО «СПОРТМАСТЕР»
intents:
  - name: greeting
    keywords: ["привет", "здравствуйте", "добрый день", "добрый вечер", "хай", "ку", "hello", "hi"]
    reply: "Привет! Чем помочь: магазины, доставка, сервис, клуб, возврат, заказ?"

  - name: stores
    keywords: ["магазин", "адрес", "адреса", "где купить", "точка продаж", "график", "режим работы"]
    reply: "Адреса и режим работы магазинов доступны на странице «Магазины» на сайте sportmaster.ru. Для подбора ближайшей точки пришлите город или геолокацию."

  - name: delivery
    keywords: ["доставка", "самовывоз", "курьер", "пвз", "пункт выдачи", "экспресс"]
    reply: "Доступны курьерская доставка и самовывоз из магазинов. Сроки и стоимость рассчитываются при оформлении заказа на сайте."

  - name: returns
    keywords: ["возврат", "обмен", "гарантия", "претензия"]
    reply: "Условия возврата и обмена опубликованы в разделе помощи на сайте. Для оформления понадобятся чек/заказ и товарный вид."

  - name: loyalty
    keywords: ["клуб", "карта", "баллы", "кешбек", "кэшбэк", "программа лояльности", "бонусы"]
    reply: "Клубная программа начисляет бонусы за покупки. Баланс и персональные предложения доступны в приложении и личном кабинете."

  - name: services
    keywords: ["сервис", "мастерская", "ремонт", "подготовка лыж", "заточка коньков", "бутфитинг", "велосервис", "печать на одежде"]
    reply: "Мастерские выполняют обслуживание велосипедов, подготовку лыж и сноубордов, заточку коньков, бутфитинг и печать на одежде. Доступность услуг зависит от магазина."

  - name: order_status
    keywords: ["заказ", "статус", "отследить", "трек", "номер заказа"]
    reply: "Статус заказа — в личном кабинете. Для уточнения оставьте последние 4 цифры номера — бот откроет форму запроса."

  - name: help
    keywords: ["помощь", "оператор", "консультант"]
    reply: "Для связи с оператором укажите тему обращения и контакт. Запрос будет передан в поддержку."

fallback: "Запрос не распознан. Варианты: магазины, доставка, возврат, клуб, сервис, заказ. Сформулируйте короче или выберите из меню."