intents:
  - name: greeting
    keywords: ["привет", "здравствуйте", "добрый день", "добрый вечер", "hello", "hi"]
    reply: "Привет! Чем помочь: магазины, доставка, возврат, клуб, сервис, заказ?"

  - name: stores
    keywords: ["магазин", "адрес", "адреса", "где купить", "график", "режим работы"]
    reply: "Адреса и режим работы см. в разделе «Магазины» на сайте. Пришлите город — подскажу ближайшие точки."

  - name: delivery
    keywords: ["доставка", "самовывоз", "курьер", "пвз", "пункт выдачи", "экспресс"]
    reply: "Доступны курьер и самовывоз. Сроки и стоимость рассчитываются при оформлении заказа."

  - name: returns
    keywords: ["возврат", "обмен", "гарантия", "претензия"]
    reply: "Условия возврата — в разделе помощи. Понадобится чек/номер заказа и товарный вид."

  - name: loyalty
    keywords: ["клуб", "карта", "баллы", "кэшбэк", "кешбек", "бонусы", "программа лояльности"]
    reply: "Бонусы за покупки. Баланс и предложения — в приложении и личном кабинете."

  - name: services
    keywords: ["сервис", "мастерская", "ремонт", "подготовка лыж", "заточка коньков", "бутфитинг", "велосервис", "печать на одежде"]
    reply: "Мастерские: велосервис, подготовка лыж/сноубордов, заточка коньков, бутфитинг, печать на одежде. Наличие зависит от магазина."

  - name: order_status
    keywords: ["заказ", "статус", "отследить", "трек", "номер заказа"]
    reply: "Статус заказа — в личном кабинете. Можете отправить последние 4 цифры номера для уточнения."

fallback: "Запрос не распознан. Темы: магазины, доставка, возврат, клуб, сервис, заказ."